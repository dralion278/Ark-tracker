    const res = await fetch(FIREBASE_URL);
    const data = await res.json();
    const customCreatures = (data && data.customCreatures) ? data.customCreatures : [];
    customCreatures.push(newCreature);
    await fetch(FIREBASE_URL, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ state, customCreatures })
    });
    return true;
  } catch (e) {
    console.error("Erreur de sauvegarde", e);
    return false;
  }
}

/* ───────────── Utilitaires d'animation ───────────── */

const GLYPHS = "ABCDEFGHJKLMNPQRSTUVWXYZ0123456789#%&*<>/=+";
function scramble(el, text, dur = 700) {
  if (reduceMotion) { el.textContent = text; return; }
  const from = el.textContent;
  const len = Math.max(from.length, text.length);
  const start = performance.now();
  const id = (el._scr = (el._scr || 0) + 1);
  (function step(now) {
    if (el._scr !== id) return;
    const t = Math.min(1, (now - start) / dur);
    let out = "";
    for (let i = 0; i < len; i++) {
      const at = 0.25 + 0.75 * (i / len);
      if (t >= at) out += text[i] || "";
      else if (t >= at - 0.4) out += text[i] === " " ? " " : GLYPHS[(Math.random() * GLYPHS.length) | 0];
      else out += from[i] || "";
    }
    el.textContent = out;
    if (t < 1) requestAnimationFrame(step);
    else el.textContent = text;
  })(start);
}

function tweenNumber(el, to, dur = 1200) {
  const from = Number(el.dataset.v || 0);
  el.dataset.v = to;
  if (reduceMotion || from === to) { el.textContent = to; return; }
  const start = performance.now();
  const id = (el._tw = (el._tw || 0) + 1);
  (function step(now) {
    if (el._tw !== id) return;
    const t = Math.min(1, (now - start) / dur);
    const e = 1 - Math.pow(1 - t, 3);
    el.textContent = Math.round(from + (to - from) * e);
    if (t < 1) requestAnimationFrame(step);
  })(start);
}

function replayClass(el, cls, ms) {
  el.classList.remove(cls);
  void el.offsetWidth;
  el.classList.add(cls);
  clearTimeout(el["_t_" + cls]);
  el["_t_" + cls] = setTimeout(() => el.classList.remove(cls), ms);
}

function toast(msg, kind = "info", tag) {
  const box = $("#toasts");
  const el = document.createElement("div");
  el.className = "toast " + kind;
  const ico = document.createElement("span");
  ico.className = "t-ico";
  ico.textContent = tag || (kind === "ok" ? "OK" : kind === "warn" ? "!!" : "//");
  const txt = document.createElement("span");
  txt.textContent = msg;
  el.append(ico, txt);
  box.appendChild(el);
  while (box.children.length > 4) box.firstChild.remove();
  setTimeout(() => {
    el.classList.add("out");
    setTimeout(() => el.remove(), 450);
  }, 3400);
}

/* ───────────── Fond 3D (grille, obélisque, spores) ───────────── */

const BG = (() => {
  const cv = $("#bg-canvas");
  const ctx = cv.getContext("2d");
  let W = 0, H = 0, dpr = 1;
  const parts = [];
  const cam = { x: 0, y: 0 }, target = { x: 0, y: 0 };
  let energy = 0, energyShown = 0;
  let gridOff = 0, lastSY = scrollY, vel = 0;
  const pulses = [];

  // Obélisque : bipyramide allongée à section carrée
  const OB_V = [[0, -2.3, 0]];
  const ring = (y, r) => [0, 1, 2, 3].map(i => { const a = i * Math.PI / 2 + Math.PI / 4; return [Math.cos(a) * r, y, Math.sin(a) * r]; });
  OB_V.push(...ring(-1.35, .46), ...ring(1.05, .36), [0, 1.95, 0]);
  const OB_E = [];
  for (let i = 0; i < 4; i++) {
    OB_E.push([0, 1 + i], [1 + i, 1 + (i + 1) % 4], [1 + i, 5 + i], [5 + i, 5 + (i + 1) % 4], [5 + i, 9]);
  }
  const ORBITS = [
    { y: -.7, r: 1.05, sp: .00045 },
    { y: .05, r: 1.35, sp: -.0003 },
    { y: .8,  r: .95, sp: .0006 }
  ];

  function spawn(p) {
    p = p || {};
    p.z = .5 + Math.random() * 3.8;
    const R = p.z * .62 + .2;
    p.x = (Math.random() * 2 - 1) * R * Math.max(1, W / Math.max(H, 1));
    p.y = (Math.random() * 2 - 1) * R;
    p.s = .0007 + Math.random() * .0016;
    p.h = Math.random();
    p.tw = Math.random() * 6.28;
    return p;
  }

  function resize() {
    dpr = 1;
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = W < 700 ? 45 : 90;
    parts.length = 0;
    for (let i = 0; i < n; i++) parts.push(spawn());
    if (reduceMotion) frame(0);
  }

  const lerpCol = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
  const CY = [95, 227, 239], MO = [111, 227, 154], BR = [168, 247, 255];

  function drawGrid() {
    const horizon = H * .62 - cam.y * 25;
    const f = H * .42;
    gridOff = (gridOff + .0035 + Math.min(Math.abs(vel), 60) * .0009) % 1;
    ctx.lineWidth = 1;
    for (let k = 0; k < 28; k++) {
      const z = .45 + (k - gridOff) * .55;
      if (z < .3) continue;
      const y = horizon + f / z;
      if (y > H + 2) continue;
      const a = Math.pow(Math.max(0, 1 - z / 15.5), 1.7) * .16;
      ctx.strokeStyle = `rgba(95,227,239,${a.toFixed(3)})`;
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
    const g = ctx.createLinearGradient(0, horizon, 0, H);
    g.addColorStop(0, "rgba(95,227,239,0)");
    g.addColorStop(1, "rgba(95,227,239,.11)");
    ctx.strokeStyle = g;
    for (let i = -14; i <= 14; i++) {
      const x = i * 1.1 - cam.x * 1.4;
      const zn = .32, zf = 16;
      ctx.beginPath();
      ctx.moveTo(W / 2 + x * f / zf, horizon + f / zf);
      ctx.lineTo(W / 2 + x * f / zn, horizon + f / zn);
      ctx.stroke();
    }
    const hg = ctx.createLinearGradient(0, horizon - 40, 0, horizon + 40);
    hg.addColorStop(0, "rgba(95,227,239,0)");
    hg.addColorStop(.5, `rgba(95,227,239,${(.06 + energyShown * .05).toFixed(3)})`);
    hg.addColorStop(1, "rgba(95,227,239,0)");
    ctx.fillStyle = hg;
    ctx.fillRect(0, horizon - 40, W, 80);
  }

  function drawObelisk(t) {
    const f = H * .85;
    const wide = W > 900;
    const S = .52;
    const ox = wide ? (W / H) * 1.0 : 0;
    const oy = -.05 + Math.sin(t * .0008) * .05 - Math.min(scrollY, 2500) * .00025;
    const oz = 3.4;
    const rot = t * .00022, tilt = .13;
    const cr = Math.cos(rot), sr = Math.sin(rot), ct = Math.cos(tilt), st = Math.sin(tilt);
    const alphaMul = wide ? .75 : .4;
    const tf = (x, y, z, spin) => {
      x *= S; y *= S; z *= S;
      if (spin) { const nx = x * cr - z * sr; z = x * sr + z * cr; x = nx; }
      const nx = x * ct - y * st; y = x * st + y * ct; x = nx;
      const X = x + ox - cam.x * .5, Y = y + oy - cam.y * .35, Z = z + oz;
      return [W / 2 + X * f / Z, H / 2 + Y * f / Z, Z];
    };

    // halo
    const c = tf(0, 0, 0, false);
    const hr = f / oz * (1.1 + energyShown * .4);
    const hg = ctx.createRadialGradient(c[0], c[1], 0, c[0], c[1], hr);
    const col = lerpCol(CY, MO, energyShown);
    hg.addColorStop(0, `rgba(${col},${((.10 + energyShown * .08) * alphaMul).toFixed(3)})`);
    hg.addColorStop(1, `rgba(${col},0)`);
    ctx.fillStyle = hg;
    ctx.fillRect(c[0] - hr, c[1] - hr, hr * 2, hr * 2);

    // arêtes
    const pts = OB_V.map(v => tf(v[0], v[1], v[2], true));
    for (const pass of [[5, .07], [1.3, .75]]) {
      ctx.lineWidth = pass[0];
      for (const [a, b] of OB_E) {
        const pa = pts[a], pb = pts[b];
        const depth = 1 - ((pa[2] + pb[2]) / 2 - oz + .4) / .8 * .55;
        ctx.strokeStyle = `rgba(${BR},${(pass[1] * depth * alphaMul).toFixed(3)})`;
        ctx.beginPath(); ctx.moveTo(pa[0], pa[1]); ctx.lineTo(pb[0], pb[1]); ctx.stroke();
      }
    }
    // cœur d'énergie
    const top = pts[0], bot = pts[9];
    const cg = ctx.createLinearGradient(top[0], top[1], bot[0], bot[1]);
    const pulse = .5 + .5 * Math.sin(t * .003);
    cg.addColorStop(0, `rgba(${BR},${(.55 * alphaMul).toFixed(3)})`);
    cg.addColorStop(pulse, `rgba(${col},${(.9 * alphaMul).toFixed(3)})`);
    cg.addColorStop(1, `rgba(${BR},0)`);
    ctx.strokeStyle = cg; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(top[0], top[1]); ctx.lineTo(bot[0], bot[1]); ctx.stroke();

    // anneaux orbitaux
    const rc = lerpCol(CY, MO, energyShown);
    ctx.lineWidth = 1.2;
    ORBITS.forEach((o, oi) => {
      const N = 72;
      let prev = null;
      for (let i = 0; i <= N; i++) {
        const a = i / N * Math.PI * 2 + t * o.sp;
        const p = tf(Math.cos(a) * o.r / S * .5, o.y, Math.sin(a) * o.r / S * .5, false);
        if (prev && (i + oi) % 6 < 4) {
          const front = .5 - Math.sin(a) * .5;
          ctx.strokeStyle = `rgba(${rc},${((.15 + front * .55) * alphaMul).toFixed(3)})`;
          ctx.beginPath(); ctx.moveTo(prev[0], prev[1]); ctx.lineTo(p[0], p[1]); ctx.stroke();
        }
        prev = p;
      }
    });

    // ondes de choc (tame / libération)
    for (let i = pulses.length - 1; i >= 0; i--) {
      const pu = pulses[i];
      const k = (t - pu.t) / 1800;
      if (k >= 1 || k < 0) { if (k >= 1) pulses.splice(i, 1); continue; }
      const r = .2 + k * 4.2;
      ctx.lineWidth = 2 * (1 - k) + .5;
      ctx.strokeStyle = `rgba(${pu.c},${((1 - k) * .7 * alphaMul).toFixed(3)})`;
      ctx.beginPath();
      for (let j = 0; j <= 60; j++) {
        const a = j / 60 * Math.PI * 2;
        const p = tf(Math.cos(a) * r, 1.95, Math.sin(a) * r, false);
        j ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]);
      }
      ctx.stroke();
    }
  }

  function drawParticles(t) {
    const f = H * .85;
    const so = scrollY * .0007;
    for (const p of parts) {
      if (!reduceMotion) p.y -= p.s * (1 + Math.min(Math.abs(vel), 40) * .04);
      const R = p.z * .62 + .2;
      let y = p.y - so;
      y = ((y + R) % (2 * R) + 2 * R) % (2 * R) - R;
      const sx = W / 2 + (p.x - cam.x * .5) * f / p.z;
      const sy = H / 2 + (y - cam.y * .3) * f / p.z;
      if (sx < -10 || sx > W + 10 || sy < -10 || sy > H + 10) continue;
      const r = Math.max(.5, 2.4 / p.z);
      const a = (.15 + .6 * (1 - p.z / 4.6)) * (.55 + .45 * Math.sin(t * .002 + p.tw));
      const c = p.h < energyShown ? MO : CY;
      if (r > 2) {
        ctx.fillStyle = `rgba(${c},${(a * .12).toFixed(3)})`;
        ctx.beginPath(); ctx.arc(sx, sy, r * 3.5, 0, 6.283); ctx.fill();
      }
      ctx.fillStyle = `rgba(${c},${a.toFixed(3)})`;
      ctx.beginPath(); ctx.arc(sx, sy, r, 0, 6.283); ctx.fill();
    }
  }

  function frame(t) {
    cam.x += (target.x - cam.x) * .04;
    cam.y += (target.y - cam.y) * .04;
    const sy = scrollY;
    vel += ((sy - lastSY) - vel) * .1;
    lastSY = sy;
    energyShown += (energy - energyShown) * .03;
    if (reduceMotion) energyShown = energy;
    ctx.clearRect(0, 0, W, H);
    drawGrid();
    ctx.globalCompositeOperation = "lighter";
    drawObelisk(t);
    drawParticles(t);
    ctx.globalCompositeOperation = "source-over";
  }

  addEventListener("resize", resize);
  addEventListener("pointermove", e => {
    target.x = (e.clientX / innerWidth - .5) * 1.2;
    target.y = (e.clientY / innerHeight - .5) * 1.2;
  }, { passive: true });
  resize();

  return {
    frame,
    setEnergy(v) { energy = v; if (reduceMotion) frame(0); },
    pulse(tamed) { pulses.push({ t: performance.now(), c: tamed ? MO : [255, 92, 108] }); }
  };
})();

/* ───────────── Particules d'effet (tame / libération) ───────────── */

const FX = (() => {
  const cv = $("#fx-canvas");
  const ctx = cv.getContext("2d");
  let W, H, dirty = false;
  const P = [], R = [];
  function resize() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  addEventListener("resize", resize);
  resize();

  function burst(x, y, o = {}) {
    if (reduceMotion) return;
    const { color = "111,227,154", n = 36, speed = 7, gravity = .1, hex = 8, pix = 0 } = o;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = speed * (.3 + Math.random());
      P.push({ type: "spark", x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: gravity, life: 0, max: 30 + Math.random() * 30, color, w: 1 + Math.random() * 1.6 });
    }
    for (let i = 0; i < hex; i++) {
      const a = Math.random() * Math.PI * 2, v = speed * .5 * (.3 + Math.random());
      P.push({ type: "hex", x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1, g: gravity * .5, life: 0, max: 50 + Math.random() * 30, color, size: 3 + Math.random() * 5, rot: Math.random() * 6, vr: (Math.random() - .5) * .3 });
    }
    for (let i = 0; i < pix; i++) {
      P.push({ type: "pix", x: x + (Math.random() - .5) * 80, y: y + (Math.random() - .5) * 40, vx: (Math.random() - .5) * 2, vy: -Math.random() * 2, g: .18, life: 0, max: 30 + Math.random() * 35, color, size: 2 + Math.random() * 3 });
    }
  }
  function wave(x, y, color = "111,227,154", max = 90) {
    if (reduceMotion) return;
    R.push({ x, y, max, life: 0, color });
  }
  function frame() {
    if (!P.length && !R.length) {
      if (dirty) { ctx.clearRect(0, 0, W, H); dirty = false; }
      return;
    }
    dirty = true;
    ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = "lighter";
    for (let i = R.length - 1; i >= 0; i--) {
      const r = R[i];
      r.life++;
      const k = r.life / 45;
      if (k >= 1) { R.splice(i, 1); continue; }
      const e = 1 - Math.pow(1 - k, 3);
      ctx.lineWidth = 3 * (1 - k) + .5;
      ctx.strokeStyle = `rgba(${r.color},${(1 - k).toFixed(3)})`;
      ctx.beginPath(); ctx.arc(r.x, r.y, 6 + e * r.max, 0, 6.283); ctx.stroke();
    }
    for (let i = P.length - 1; i >= 0; i--) {
      const p = P[i];
      p.life++;
      if (p.life >= p.max) { P.splice(i, 1); continue; }
      p.vx *= .94; p.vy = p.vy * .94 + p.g;
      p.x += p.vx; p.y += p.vy;
      const a = 1 - p.life / p.max;
      if (p.type === "spark") {
        ctx.strokeStyle = `rgba(${p.color},${a.toFixed(3)})`;
        ctx.lineWidth = p.w;
        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 2.6, p.y - p.vy * 2.6); ctx.stroke();
      } else if (p.type === "hex") {
        p.rot += p.vr;
        ctx.strokeStyle = `rgba(${p.color},${a.toFixed(3)})`;
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        for (let j = 0; j < 6; j++) {
          const an = p.rot + j * Math.PI / 3;
          const px = p.x + Math.cos(an) * p.size, py = p.y + Math.sin(an) * p.size;
          j ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
        }
        ctx.closePath(); ctx.stroke();
      } else {
        ctx.fillStyle = `rgba(${p.color},${(a * (Math.random() > .2 ? 1 : .3)).toFixed(3)})`;
        ctx.fillRect(p.x, p.y, p.size, p.size);
      }
    }
    ctx.globalCompositeOperation = "source-over";
  }
  return { burst, wave, frame };
})();

function loop(t) {
  BG.frame(t);
  FX.frame();
  requestAnimationFrame(loop);
}
if (!reduceMotion) requestAnimationFrame(loop);

/* ───────────── Cartes ───────────── */

const cardEls = new Map();
let catMeta = new Map();

const SEAL_SVG = `<svg viewBox="0 0 48 48" aria-hidden="true"><polygon class="seal-hex" points="24,3 42,13.5 42,34.5 24,45 6,34.5 6,13.5"/><polygon class="seal-hex-inner" points="24,9 37,16.5 37,31.5 24,39 11,31.5 11,16.5"/><path class="seal-check" d="M16 24.5l5.5 5.5L32.5 19"/></svg>`;

function createCard(c) {
  const idx = CREATURE_LIST.indexOf(c) + 1;
  const card = document.createElement("div");
  card.className = "card";
  card.tabIndex = 0;
  card.setAttribute("role", "checkbox");
  card.dataset.name = c.n;
  card.innerHTML = `
    <div class="card-tilt">
      <div class="card-inner">
        <div class="card-aura"></div>
        <div class="card-face"><i class="face-holo"></i><i class="face-fill"></i><i class="face-accent"></i><i class="face-glitch"></i></div>
        <div class="card-media"><div class="media-grid"></div><div class="media-lines"></div><div class="media-beam"></div></div>
        <div class="card-body">
          <div class="card-meta"><span class="card-id">SPC-${String(idx).padStart(3, "0")}</span><span class="card-status"><i></i><b></b></span></div>
          <p class="creature-name"></p>
        </div>
        <div class="card-corners"><i></i><i></i><i></i><i></i></div>
        <div class="card-seal">${SEAL_SVG}</div>
        <div class="card-glare"></div>
      </div>
    </div>`;
  card.querySelector(".creature-name").textContent = c.n;
  card.setAttribute("aria-label", c.n);

  const img = document.createElement("img");
  img.alt = c.n;
  img.loading = "lazy";
  img.decoding = "async";
  card.querySelector(".card-media").insertBefore(img, card.querySelector(".media-lines"));
  loadImage(img, imageCandidates(c.n));

  setCardState(card, isTamed(c.n), { animate: false });

  card.addEventListener("click", e => {
    toggleTame(c.n, e.detail ? { x: e.clientX, y: e.clientY } : null);
  });
  card.addEventListener("keydown", e => {
    if (e.key === " " || e.key === "Enter") { e.preventDefault(); toggleTame(c.n, null); }
  });
  bindTilt(card);
  cardEls.set(c.n, card);
  return card;
}

function getCard(c) {
  return cardEls.get(c.n) || createCard(c);
}

function bindTilt(card) {
  if (!finePointer || reduceMotion) return;
  const tilt = card.querySelector(".card-tilt");
  let raf = 0, cx = 0, cy = 0;
  card.addEventListener("pointerenter", () => {
    clearTimeout(card._live);
    card.classList.add("live", "hovering");
  });
  card.addEventListener("pointermove", e => {
    cx = e.clientX; cy = e.clientY;
    if (raf) return;
    raf = requestAnimationFrame(() => {
      raf = 0;
      const r = card.getBoundingClientRect();
      const px = Math.min(1, Math.max(0, (cx - r.left) / r.width));
      const py = Math.min(1, Math.max(0, (cy - r.top) / r.height));
      tilt.style.setProperty("--rx", ((.5 - py) * 16).toFixed(2) + "deg");
      tilt.style.setProperty("--ry", ((px - .5) * 20).toFixed(2) + "deg");
      const glare = card.querySelector(".card-glare");
      glare.style.setProperty("--mx", (px * 100).toFixed(1) + "%");
      glare.style.setProperty("--my", (py * 100).toFixed(1) + "%");
    });
  });
  card.addEventListener("pointerleave", () => {
    card.classList.remove("hovering");
    tilt.style.setProperty("--rx", "0deg");
    tilt.style.setProperty("--ry", "0deg");
    goLive(card, 750);
  });
}

// La 3D (perspective + calques translateZ) ne s'active que sur la carte en cours
// d'interaction : 145 cartes en 3D permanente font ramer le défilement.
function goLive(card, ms) {
  card.classList.add("live");
  clearTimeout(card._live);
  card._live = setTimeout(() => {
    if (!card.classList.contains("hovering")) card.classList.remove("live");
  }, ms);
}

function setCardState(card, tamed, { animate = true, origin = null } = {}) {
  card.classList.toggle("tamed", tamed);
  card.setAttribute("aria-checked", String(tamed));
  const status = card.querySelector(".card-status b");
  const label = tamed ? "Tamée" : "Sauvage";
  if (!animate || reduceMotion) { status.textContent = label; return; }

  card.classList.remove("fx-tame", "fx-untame");
  if (!card.classList.contains("hovering")) goLive(card, 1400);
  replayClass(card, tamed ? "fx-tame" : "fx-untame", 1300);
  scramble(status, label, 600);

  // onde depuis le point de clic
  const face = card.querySelector(".card-face");
  const fr = face.getBoundingClientRect();
  const rp = document.createElement("span");
  rp.className = "ripple" + (tamed ? "" : " out");
  rp.style.left = ((origin ? origin.x : fr.left + fr.width / 2) - fr.left) + "px";
  rp.style.top = ((origin ? origin.y : fr.top + fr.height / 2) - fr.top) + "px";
  face.appendChild(rp);
  setTimeout(() => rp.remove(), 900);

  const r = card.getBoundingClientRect();
  if (r.bottom > 0 && r.top < innerHeight) {
    const s = card.querySelector(".card-seal").getBoundingClientRect();
    const sx = s.left + s.width / 2, sy = s.top + s.height / 2;
    if (tamed) {
      setTimeout(() => {
        FX.burst(sx, sy, { color: "111,227,154", n: 34, speed: 8, hex: 9 });
        FX.burst(sx, sy, { color: "168,247,255", n: 14, speed: 5, hex: 0 });
        FX.wave(sx, sy, "111,227,154", 70);
      }, 380);
    } else {
      FX.burst(sx, sy, { color: "255,92,108", n: 16, speed: 5, hex: 4, gravity: .2 });
      FX.burst(r.left + r.width / 2, r.top + r.height * .4, { color: "95,227,239", n: 0, hex: 0, pix: 26 });
    }
  }
  BG.pulse(tamed);
}

/* ───────────── Vue ───────────── */

function matchesFilter(name) {
  const tamed = isTamed(name);
  if (currentFilter === "tamed" && !tamed) return false;
  if (currentFilter === "untamed" && tamed) return false;
  if (searchTerm && !name.toLowerCase().includes(searchTerm.toLowerCase())) return false;
  return true;
}

function groupByCategory() {
  const byCategory = {};
  CREATURE_LIST.forEach(c => {
    if (!byCategory[c.c]) byCategory[c.c] = [];
    byCategory[c.c].push(c);
  });
  const orderedCats = [...CATEGORY_ORDER, ...Object.keys(byCategory).filter(c => !CATEGORY_ORDER.includes(c))];
  return { byCategory, orderedCats };
}

const cardIO = new IntersectionObserver(entries => {
  const visible = entries.filter(e => e.isIntersecting);
  visible.forEach((e, i) => {
    cardIO.unobserve(e.target);
    revealCard(e.target, Math.min(i * 45, 700));
  });
}, { rootMargin: "0px 0px -6% 0px", threshold: .08 });

const headIO = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (!e.isIntersecting) return;
    headIO.unobserve(e.target);
    e.target.classList.add("revealed");
    const meta = catMeta.get(e.target.dataset.cat);
    if (meta) meta.bar.style.width = (meta.done / meta.total * 100) + "%";
  });
}, { threshold: .2 });

function revealCard(card, delay) {
  card.classList.remove("pending");
  if (reduceMotion) return;
  card.animate([
    { opacity: 0, transform: "perspective(900px) translateY(70px) rotateX(-40deg) scale(.88)" },
    { opacity: 1, transform: "perspective(900px) translateY(0) rotateX(0) scale(1)" }
  ], { duration: 950, delay, easing: "cubic-bezier(.16,1,.3,1)", fill: "backwards" });
  const img = card.querySelector(".card-media img");
  if (img) {
    img.animate([
      { clipPath: "inset(0 0 100% 0)" },
      { clipPath: "inset(0 0 0 0)" }
    ], { duration: 800, delay: delay + 220, easing: "cubic-bezier(.65,0,.35,1)", fill: "backwards" });
  }
  const beam = card.querySelector(".media-beam");
  beam.classList.add("in");
  beam.animate([
    { transform: "translateY(-110%)", opacity: 1 },
    { transform: "translateY(260%)", opacity: 1 }
  ], { duration: 800, delay: delay + 220, easing: "cubic-bezier(.65,0,.35,1)" }).onfinish = () => beam.classList.remove("in");
}

function buildView() {
  const container = document.getElementById("categories-container");
  container.innerHTML = "";
  catMeta = new Map();
  const { byCategory, orderedCats } = groupByCategory();
  let anyShown = false;

  orderedCats.forEach(cat => {
    const list = byCategory[cat];
    if (!list) return;
    const filtered = list.filter(c => matchesFilter(c.n));
    if (filtered.length === 0) return;
    anyShown = true;

    const done = list.filter(c => isTamed(c.n)).length;
    const section = document.createElement("section");
    section.className = "category";
    section.innerHTML = `
      <div class="category-header">
        <span class="cat-diamond"></span>
        <h2></h2>
        <span class="category-count"><b></b> / ${list.length}</span>
        <span class="cat-bar"></span>
      </div>
      <div class="grid"></div>`;
    const header = section.querySelector(".category-header");
    header.dataset.cat = cat;
    header.classList.toggle("complete", done === list.length);
    section.querySelector("h2").textContent = cat;
    const countEl = section.querySelector(".category-count b");
    countEl.textContent = done;
    countEl.dataset.v = done;
    const bar = section.querySelector(".cat-bar");
    catMeta.set(cat, { header, countEl, bar, total: list.length, done });
    if (reduceMotion) { header.classList.add("revealed"); bar.style.width = (done / list.length * 100) + "%"; }
    else headIO.observe(header);

    const grid = section.querySelector(".grid");
    filtered.forEach(c => {
      const card = getCard(c);
      clearTimeout(card._rm);
      card.getAnimations().forEach(a => a.cancel());
      card.classList.add("pending");
      grid.appendChild(card);
      cardIO.observe(card);
    });
    container.appendChild(section);
  });

  if (!anyShown) showEmpty(container);
}

function showEmpty(container) {
  container.innerHTML = '<div class="empty-note"><div class="radar"></div><div>Aucune créature ne correspond à ta recherche.</div></div>';
}

function flip(elements, mutate) {
  const first = elements.map(el => el.getBoundingClientRect());
  mutate();
  if (reduceMotion) return;
  elements.forEach((el, i) => {
    if (!el.isConnected) return;
    const last = el.getBoundingClientRect();
    const dx = first[i].left - last.left, dy = first[i].top - last.top;
    if (dx || dy) el.animate([{ transform: `translate(${dx}px,${dy}px)` }, { transform: "none" }], { duration: 600, easing: "cubic-bezier(.16,1,.3,1)" });
  });
}

function removeCardAnimated(card) {
  const grid = card.parentElement;
  if (!grid) return;
  const out = card.animate([
    { opacity: 1, transform: "none", filter: "none" },
    { opacity: 0, transform: "scale(.82) rotateX(30deg) translateY(-24px)", filter: "blur(8px)" }
  ], { duration: reduceMotion ? 1 : 450, easing: "cubic-bezier(.7,0,.84,0)", fill: "forwards" });
  out.onfinish = () => {
    if (matchesFilter(card.dataset.name)) { out.cancel(); return; }
    const sibs = [...grid.children].filter(x => x !== card);
    flip(sibs, () => { card.remove(); out.cancel(); });
    if (!grid.children.length) {
      const sec = grid.closest(".category");
      sec.animate([{ opacity: 1 }, { opacity: 0, transform: "translateY(-10px)" }], { duration: 300, fill: "forwards" })
        .onfinish = () => {
          sec.remove();
          const container = document.getElementById("categories-container");
          if (!container.querySelector(".category")) showEmpty(container);
        };
    }
  };
}

let countersReady = false;
const prevCatDone = new Map();
let prevAllDone = false;
let prevTamedCount = -1;

function updateCounters() {
  const total = CREATURE_LIST.length;
  const tamedCount = CREATURE_LIST.filter(c => isTamed(c.n)).length;
  const frac = total ? tamedCount / total : 0;
  const pct = Math.round(frac * 100);

  document.getElementById("total-count").textContent = total;
  tweenNumber(document.getElementById("tamed-count"), tamedCount);
  tweenNumber(document.getElementById("ring-label"), pct, 1400);
  const C = 238.76;
  document.getElementById("ring-fg").style.strokeDashoffset = C - C * frac;
  document.getElementById("pt-bar").style.width = (frac * 100) + "%";
  document.documentElement.style.setProperty("--energy", frac.toFixed(3));
  BG.setEnergy(frac);

  tweenNumber(document.getElementById("cnt-all"), total, 600);
  tweenNumber(document.getElementById("cnt-untamed"), total - tamedCount, 600);
  tweenNumber(document.getElementById("cnt-tamed"), tamedCount, 600);

  if (countersReady && prevTamedCount !== tamedCount && !reduceMotion) {
    replayClass(document.getElementById("progress-block"), "pulse", 900);
  }
  prevTamedCount = tamedCount;

  const { byCategory } = groupByCategory();
  Object.entries(byCategory).forEach(([cat, list]) => {
    const done = list.filter(c => isTamed(c.n)).length;
    const complete = done === list.length;
    const meta = catMeta.get(cat);
    if (meta) {
      meta.done = done;
      tweenNumber(meta.countEl, done, 700);
      meta.header.classList.toggle("complete", complete);
      if (meta.header.classList.contains("revealed")) meta.bar.style.width = (done / list.length * 100) + "%";
    }
    if (countersReady && complete && !prevCatDone.get(cat)) celebrateCategory(cat, meta);
    prevCatDone.set(cat, complete);
  });

  const allDone = total > 0 && tamedCount === total;
  if (countersReady && allDone && !prevAllDone) celebrateAll();
  prevAllDone = allDone;
  countersReady = true;
}

function celebrateCategory(cat, meta) {
  toast(`Biome complété : ${cat}`, "ok", "100%");
  if (!meta) return;
  replayClass(meta.header, "celebrate", 1500);
  const r = meta.header.getBoundingClientRect();
  if (r.bottom < 0 || r.top > innerHeight) return;
  for (let i = 0; i < 5; i++) {
    setTimeout(() => FX.burst(r.left + r.width * (i + .5) / 5, r.top + r.height / 2, { n: 22, speed: 7, hex: 5 }), i * 90);
  }
}

function celebrateAll() {
  toast("Tous les spécimens sont tamés. GG !", "ok", "ARK");
  for (let i = 0; i < 14; i++) {
    setTimeout(() => {
      const x = innerWidth * (.1 + Math.random() * .8), y = innerHeight * (.15 + Math.random() * .5);
      FX.burst(x, y, { color: i % 2 ? "111,227,154" : "168,247,255", n: 40, speed: 10, hex: 10 });
      FX.wave(x, y, "111,227,154", 140);
    }, i * 160);
  }
}

/* ───────────── Interactions ───────────── */

function setSync(kind) {
  const chip = document.getElementById("sync-chip");
  chip.classList.remove("ok", "saving", "offline");
  chip.classList.add(kind);
  renderSyncText();
}
function renderSyncText() {
  const chip = document.getElementById("sync-chip");
  const txt = document.getElementById("sync-text");
  if (chip.classList.contains("saving")) txt.textContent = "Transmission ARK-NET…";
  else if (chip.classList.contains("offline")) txt.textContent = "Hors ligne — nouvelle tentative…";
  else if (lastSync) {
    const s = Math.round((Date.now() - lastSync) / 1000);
    txt.textContent = "ARK-NET · synchro " + (s < 5 ? "à l'instant" : `il y a ${s < 60 ? s + " s" : Math.round(s / 60) + " min"}`);
  }
}
setInterval(renderSyncText, 1000);

function toggleTame(name, origin) {
  if (!state[name]) state[name] = { tamed: true };
  else state[name].tamed = !state[name].tamed;
  lastLocalChange = Date.now();
  saving++;
  setSync("saving");
  saveAll().then(ok => {
    online = ok;
    if (ok) lastSync = Date.now();
  }).finally(() => {
    saving--;
    if (!saving) setSync(online ? "ok" : "offline");
  });
  onStateChanged([name], { origin });
}

function onStateChanged(names, { origin = null } = {}) {
  let needRebuild = false;
  names.forEach(n => {
    const card = cardEls.get(n);
    if (!card) { needRebuild = needRebuild || matchesFilter(n); return; }
    setCardState(card, isTamed(n), { animate: card.isConnected, origin });
    if (card.isConnected) {
      clearTimeout(card._rm);
      if (!matchesFilter(n)) {
        card._rm = setTimeout(() => {
          if (!matchesFilter(n) && card.isConnected) removeCardAnimated(card);
        }, 1000);
      }
    } else if (matchesFilter(n)) {
      needRebuild = true;
    }
  });
  if (needRebuild) buildView();
  updateCounters();
}

async function poll() {
  if (saving > 0) return;
  const started = Date.now();
  const data = await fetchData();
  if (!data) { online = false; if (!saving) setSync("offline"); return; }
  online = true;
  if (saving > 0 || lastLocalChange > started - 300) return;
  const added = mergeCustoms(data.customs);
  const names = new Set([...Object.keys(state), ...Object.keys(data.state)]);
  const changed = [...names].filter(n => isTamed(n) !== !!(data.state[n] && data.state[n].tamed));
  state = data.state;
  lastSync = Date.now();
  setSync("ok");
  if (added) buildView();
  if (changed.length) {
    onStateChanged(changed);
    if (changed.length === 1) {
      const n = changed[0];
      toast(`${n} — ${isTamed(n) ? "tamée" : "libérée"} par ton partenaire`, isTamed(n) ? "ok" : "info", "SYNC");
    } else {
      toast(`${changed.length} spécimens synchronisés depuis ARK-NET`, "info", "SYNC");
    }
  } else if (added) {
    updateCounters();
  }
}

function positionIndicator() {
  const active = document.querySelector(".pill.active");
  const ind = document.getElementById("pill-indicator");
  if (!active) return;
  ind.style.width = active.offsetWidth + "px";
  ind.style.height = active.offsetHeight + "px";
  ind.style.transform = `translate(${active.offsetLeft}px, ${active.offsetTop}px)`;
}
addEventListener("resize", positionIndicator);
document.fonts && document.fonts.ready.then(positionIndicator);

let searchT = 0;
document.getElementById("search").addEventListener("input", (e) => {
  searchTerm = e.target.value;
  clearTimeout(searchT);
  searchT = setTimeout(buildView, 140);
});

document.addEventListener("keydown", e => {
  if (e.key === "/" && !/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName)) {
    e.preventDefault();
    document.getElementById("search").focus();
  }
});

document.querySelectorAll(".pill").forEach(pill => {
  pill.addEventListener("click", () => {
    if (pill.classList.contains("active")) return;
    document.querySelectorAll(".pill").forEach(p => { p.classList.remove("active"); p.setAttribute("aria-checked", "false"); });
    pill.classList.add("active");
    pill.setAttribute("aria-checked", "true");
    currentFilter = pill.dataset.filter;
    positionIndicator();
    buildView();
  });
});

document.querySelectorAll("[data-magnetic]").forEach(b => {
  if (!finePointer || reduceMotion) return;
  b.addEventListener("pointermove", e => {
    const r = b.getBoundingClientRect();
    const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    b.style.transform = `translate(${dx * .16}px, ${dy * .3}px)`;
  });
  b.addEventListener("pointerleave", () => { b.style.transform = ""; });
});

document.getElementById("toggle-add").addEventListener("click", (e) => {
  const wrap = document.getElementById("custom-form");
  const open = wrap.classList.toggle("open");
  e.currentTarget.setAttribute("aria-expanded", String(open));
  if (open) setTimeout(() => document.getElementById("new-name").focus(), 250);
});

async function confirmAdd() {
  const input = document.getElementById("new-name");
  const name = input.value.trim();
  const cat = document.getElementById("new-category").value;
  if (!name) { replayClass(input, "shake", 450); input.focus(); return; }
  if (CREATURE_LIST.find(c => c.n.toLowerCase() === name.toLowerCase())) {
    replayClass(input, "shake", 450);
    toast("Cette créature existe déjà dans la liste.", "warn");
    return;
  }
  const newC = { n: name, c: cat };
  CREATURE_LIST.push(newC);
  input.value = "";
  document.getElementById("custom-form").classList.remove("open");
  document.getElementById("toggle-add").setAttribute("aria-expanded", "false");
  buildView();
  updateCounters();
  const card = cardEls.get(name);
  if (card && card.isConnected) {
    card.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "center" });
    replayClass(card, "spotlight", 3300);
  }
  toast(`${name} ajouté au registre (${cat})`, "ok", "NEW");
  const ok = await saveCustom(newC);
  if (!ok) toast("Échec de l'envoi vers ARK-NET. Réessaie plus tard.", "warn");
}
document.getElementById("confirm-add").addEventListener("click", confirmAdd);
document.getElementById("new-name").addEventListener("keydown", e => { if (e.key === "Enter") confirmAdd(); });

let compact = false;
addEventListener("scroll", () => {
  const c = scrollY > 60;
  if (c !== compact) {
    compact = c;
    document.getElementById("top-bar").classList.toggle("compact", c);
  }
}, { passive: true });

/* ───────────── Démarrage ───────────── */

function sessionFlag(key, set) {
  try {
    if (set) sessionStorage.setItem(key, "1");
    return sessionStorage.getItem(key) === "1";
  } catch (e) { return false; }
}

async function runBoot(dataP) {
  const boot = document.getElementById("boot");
  const log = document.getElementById("boot-log");
  const bar = document.getElementById("boot-bar");
  const pctEl = document.getElementById("boot-pct");
  const full = !sessionFlag("ark-booted");
  let skip = false;
  const doSkip = () => { skip = true; };
  boot.addEventListener("click", doSkip);
  const onKey = e => { if (["Escape", "Enter", " "].includes(e.key)) doSkip(); };
  addEventListener("keydown", onKey);

  let pct = 0, pctTarget = 0;
  const barLoop = () => {
    pct += (pctTarget - pct) * (skip ? .5 : .12);
    bar.style.width = pct + "%";
    pctEl.textContent = String(Math.round(pct)).padStart(3, "0") + "%";
    if (boot.isConnected) requestAnimationFrame(barLoop);
  };
  requestAnimationFrame(barLoop);

  async function line(text, extra, p) {
    const div = document.createElement("div");
    div.className = "typing";
    log.appendChild(div);
    for (let i = 1; i <= text.length && !skip; i++) {
      div.textContent = text.slice(0, i);
      await sleep(13);
    }
    div.textContent = text;
    if (extra) {
      const s = document.createElement("span");
      s.className = extra.cls;
      s.textContent = extra.text;
      div.appendChild(s);
    }
    div.classList.remove("typing");
    pctTarget = p;
    if (!skip) await sleep(110);
  }

  const data = Promise.race([dataP, sleep(6000)]);
  if (full) {
    await line("Initialisation de l'implant ...... ", { cls: "ok", text: "OK" }, 16);
    await line("Liaison neuronale ................ ", { cls: "ok", text: "OK" }, 34);
    await line("Connexion ARK-NET ................ ", null, 48);
    await data;
    log.lastChild.appendChild(Object.assign(document.createElement("span"), { className: online ? "ok" : "num", textContent: online ? "OK" : "HORS LIGNE" }));
    pctTarget = 62;
    await line("Décodage des spécimens ........... ", { cls: "num", text: String(CREATURE_LIST.length) }, 82);
    const tamedCount = CREATURE_LIST.filter(c => isTamed(c.n)).length;
    await line("Spécimens tamés .................. ", { cls: "ok", text: String(tamedCount) }, 100);
    if (!skip) await sleep(320);
  } else {
    pctTarget = 70;
    await data;
    pctTarget = 100;
    await sleep(skip ? 0 : 380);
  }
  sessionFlag("ark-booted", true);
  removeEventListener("keydown", onKey);

  boot.classList.add("out");
  document.body.classList.remove("booting");
  await sleep(380);
  enter();
  setTimeout(() => boot.remove(), 1500);
}

function enter() {
  document.body.classList.add("booted");
  positionIndicator();
  document.body.classList.remove("booting");
  scramble(document.getElementById("h1-a"), "Défi", 900);
  scramble(document.getElementById("h1-b"), "tame'em all", 1300);
  scramble(document.getElementById("players-label"), "Progression partagée — coche les créatures que vous avez tamées", 1100);
  buildView();
  setTimeout(() => {
    updateCounters();
    positionIndicator();
  }, reduceMotion ? 0 : 450);
  setSync(online ? "ok" : "offline");
}

(async () => {
  const dataP = loadState();
  if (reduceMotion) {
    document.getElementById("boot").remove();
    await dataP;
    enter();
    return;
  }
  await runBoot(dataP);
})();

setInterval(poll, 15000);

document.addEventListener("visibilitychange", () => {
  if (!document.hidden) poll();
});
</script>
